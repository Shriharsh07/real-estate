name: Build on Master

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        env:
          VERSION_TOKEN: ${{ secrets.VERSION_TOKEN }}
          ACCOUNT_OWNER: ${{ vars.ACCOUNT_OWNER }}
          REPO_NAME: ${{ vars.REPO_NAME }}