<div class="app-container">

  @if (!isLoginPage) {
  <header class="app-header">
    <div class="navbar">

      <!-- Brand -->
      <a routerLink="/dashboard" class="navbar-brand">
        <div class="brand-icon-wrap">
          <mat-icon class="brand-mat-icon">apartment</mat-icon>
        </div>
        <span class="brand-name">EstateHub</span>
      </a>

      <!-- Nav links -->
      <nav class="navbar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a routerLink="/property-list" routerLinkActive="active" class="nav-link">
          <mat-icon>home_work</mat-icon>
          <span>Properties</span>
        </a>
        <a routerLink="/owner-list" routerLinkActive="active" class="nav-link">
          <mat-icon>people</mat-icon>
          <span>Owners</span>
        </a>
      </nav>

      <!-- Right side -->
      <div class="navbar-end">
        <div class="user-chip">
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="user-label">Admin</span>
        </div>
        <button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>

    </div>
  </header>
  }

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

</div>
