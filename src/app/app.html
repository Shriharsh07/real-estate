<div class="app-container">

  @if (!isLoginPage) {
  <header class="app-header">
    <div class="navbar">

      <!-- Brand -->
      <a routerLink="/dashboard" class="navbar-brand" (click)="closeMobileMenu()">
        <div class="brand-icon-wrap">
          <mat-icon class="brand-mat-icon">apartment</mat-icon>
        </div>
        <span class="brand-name">EstateHub</span>
      </a>

      <!-- Mobile menu toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
        <div class="hamburger-icon" [class.open]="mobileMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>

      <!-- Nav links -->
      <nav class="navbar-nav" [class.mobile-open]="mobileMenuOpen">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a routerLink="/property-list" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
          <mat-icon>home_work</mat-icon>
          <span>Properties</span>
        </a>
        <a routerLink="/owner-list" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
          <mat-icon>people</mat-icon>
          <span>Owners</span>
        </a>

        <!-- Mobile-only user actions -->
        <div class="mobile-nav-divider"></div>
        <div class="mobile-user-section">
          <div class="user-chip">
            <mat-icon class="user-icon">account_circle</mat-icon>
            <span class="user-label">Admin</span>
          </div>
          <button class="logout-btn mobile-logout" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </div>
      </nav>

      <!-- Right side -->
      <div class="navbar-end">
        <div class="user-chip">
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="user-label">Admin</span>
        </div>
        <button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>

    </div>
  </header>
  }

  <!-- Mobile menu backdrop -->
  <div class="mobile-menu-backdrop" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()"></div>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <span class="footer-text">© {{ currentYear }} EstateHub. All rights reserved.</span>
      <div class="app-version">
        <span>v{{ appVersion }}</span>
      </div>
    </div>
  </footer>

</div>
