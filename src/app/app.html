<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" routerLink="/" (click)="menu=false"
      ><span class="brand-mark">⌂</span>Estate<span>Hub</span
      ><small>SPACES FOR YOUR NEXT CHAPTER</small></a
    ><button
      class="menu-toggle"
      (click)="menu=!menu"
      [attr.aria-expanded]="menu"
      aria-controls="navigation"
      aria-label="Toggle navigation"
    >
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M4 6h16M4 12h16M4 18h16"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <nav id="navigation" aria-label="Main navigation" [class.open]="menu" (keydown.escape)="menu=false">
      <a routerLink="/" routerLinkActive="current" [routerLinkActiveOptions]="{exact:true}" ariaCurrentWhenActive="page" (click)="menu=false">Explore properties</a
      >@if(auth.isAdmin){<a routerLink="/dashboard" routerLinkActive="current" [routerLinkActiveOptions]="{exact:true}" ariaCurrentWhenActive="page" (click)="menu=false"
        >Overview</a
      ><a routerLink="/property-list" routerLinkActive="current" [routerLinkActiveOptions]="{exact:true}" ariaCurrentWhenActive="page" (click)="menu=false">Manage listings</a
      ><a routerLink="/owner-list" routerLinkActive="current" [routerLinkActiveOptions]="{exact:true}" ariaCurrentWhenActive="page" (click)="menu=false">Owners</a
      ><a routerLink="/enquiries" routerLinkActive="current" [routerLinkActiveOptions]="{exact:true}" ariaCurrentWhenActive="page" (click)="menu=false">Enquiries</a>}
      @if(auth.loggedIn){<button class="btn secondary" (click)="logout()">
        Log out</button
      >}@else{<a routerLink="/login" (click)="menu=false">Log in</a
      ><a class="btn" routerLink="/signup" (click)="menu=false">Get started ↗</a
      >}
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a class="brand" routerLink="/">Estate<span>Hub</span></a>
      <p>Considered spaces. New beginnings.</p>
    </div>
    <div class="footer-meta">
      <span>© {{year}} EstateHub. All rights reserved.</span>
      <a class="footer-admin" routerLink="/admin/login">Admin sign in</a>
    </div>
  </div>
</footer>
