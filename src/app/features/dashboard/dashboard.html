<div class="dashboard-page">

  <!-- Page header -->
  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Welcome back, here's your property overview</p>
    </div>
    <button class="refresh-btn" (click)="loadStats()" [disabled]="isLoading">
      <mat-icon *ngIf="!isLoading">refresh</mat-icon>
      <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
      <span>{{ isLoading ? 'Loading...' : 'Refresh' }}</span>
    </button>
  </div>

  <!-- Loading State -->
  <div class="state-card" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading dashboard…</p>
  </div>

  <!-- Stats grid -->
  <div class="stats-grid" *ngIf="!isLoading">

    <mat-card class="stat-card total">
      <mat-card-content>
        <div class="stat-icon-wrap">
          <mat-icon>home_work</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-label">Total Properties</span>
          <span class="stat-value">{{ stats.total }}</span>
        </div>
      </mat-card-content>
      <div class="stat-bar"></div>
    </mat-card>

    <mat-card class="stat-card available">
      <mat-card-content>
        <div class="stat-icon-wrap">
          <mat-icon>check_circle</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-label">Available</span>
          <span class="stat-value">{{ stats.available }}</span>
        </div>
      </mat-card-content>
      <div class="stat-bar"></div>
    </mat-card>

    <mat-card class="stat-card sold">
      <mat-card-content>
        <div class="stat-icon-wrap">
          <mat-icon>sell</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-label">Sold</span>
          <span class="stat-value">{{ stats.sold }}</span>
        </div>
      </mat-card-content>
      <div class="stat-bar"></div>
    </mat-card>

    <mat-card class="stat-card rented">
      <mat-card-content>
        <div class="stat-icon-wrap">
          <mat-icon>key</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-label">Rented</span>
          <span class="stat-value">{{ stats.rented }}</span>
        </div>
      </mat-card-content>
      <div class="stat-bar"></div>
    </mat-card>

  </div>

</div>
