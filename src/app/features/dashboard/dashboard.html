<div class="dashboard-container">
  <div class="page-header">
    <h2>📊 Dashboard</h2>
    <p class="subtitle">Welcome back! Here's your property overview.</p>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid">
    <mat-card class="stat-card total">
      <mat-card-content>
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <p class="stat-label">Total Properties</p>
          <h3 class="stat-value">{{ totalProperties }}</h3>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card available">
      <mat-card-content>
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <p class="stat-label">Available</p>
          <h3 class="stat-value">{{ availableProperties }}</h3>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card sold">
      <mat-card-content>
        <div class="stat-icon">🎉</div>
        <div class="stat-info">
          <p class="stat-label">Sold</p>
          <h3 class="stat-value">{{ soldProperties }}</h3>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card rented">
      <mat-card-content>
        <div class="stat-icon">🔑</div>
        <div class="stat-info">
          <p class="stat-label">Rented</p>
          <h3 class="stat-value">{{ rentedProperties }}</h3>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Quick Actions -->
  <div class="actions-section mt-24">
    <h3>Quick Actions</h3>
    <div class="actions-grid">
      <button mat-raised-button color="primary" routerLink="/property-form">
        <span>➕ Add Property</span>
      </button>
      <button mat-stroked-button routerLink="/property-list">
        <span>📋 View All Properties</span>
      </button>
    </div>
  </div>
</div>
