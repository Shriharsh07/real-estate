<div class="dashboard-container">
  <div class="page-header">
    <h2>📊 Dashboard</h2>
    <p class="subtitle">Welcome back! Here's your property overview.</p>
  </div>

  <!-- Stats Cards -->

  <div class="cards">

    <mat-card class="card total">
      <h3>Total</h3>
      <p>{{ stats.total}}</p>
    </mat-card>

    <mat-card class="card available">
      <h3>Available</h3>
      <p>{{ stats.available }}</p>
    </mat-card>

    <mat-card class="card sold">
      <h3>Sold</h3>
      <p>{{ stats.sold }}</p>
    </mat-card>

    <mat-card class="card rented">
      <h3>Rented</h3>
      <p>{{ stats.rented}}</p>
    </mat-card>

  </div>
  <!-- Quick Actions -->
  <div class="actions-section mt-24">
    <h3>Quick Actions</h3>
    <div class="actions-grid">
      <button mat-raised-button color="primary" routerLink="/property-form">
        <span>➕ Add Property</span>
      </button>
      <button mat-stroked-button routerLink="/property-list">
        <span>📋 View All Properties</span>
      </button>
    </div>
  </div>
</div>
