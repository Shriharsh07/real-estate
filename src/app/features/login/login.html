<div class="login-container">
  <div class="login-background"></div>
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-header">
        <div class="logo-icon">🏢</div>
        <h2>Real Estate Admin</h2>
        <p class="subtitle">Manage your properties with ease</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <mat-icon matPrefix>👤</mat-icon>
          <input matInput [(ngModel)]="username" name="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width mt-16">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>🔐</mat-icon>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="login-button mt-24">
          🚀 Sign In
        </button>
      </form>

      <div class="login-footer">
        <p class="forgot-password">Need help? Contact support</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
