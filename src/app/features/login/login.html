<div class="login-page">
  <div class="login-wrapper">

    <div class="brand-header">
      <div class="brand-icon-wrap">
        <mat-icon class="brand-icon">apartment</mat-icon>
      </div>
      <span class="brand-name">EstateHub</span>
    </div>

    <mat-card class="login-card">
      <mat-card-content>

        <div class="card-heading">
          <h1 class="card-title">Welcome back</h1>
          <p class="card-subtitle">Sign in to your admin dashboard</p>
        </div>

        <form (ngSubmit)="login()" class="login-form">

          <mat-form-field appearance="outline" class="field-full">
            <mat-label>Username</mat-label>
            <mat-icon matPrefix class="field-icon">person</mat-icon>
            <input matInput [(ngModel)]="username" name="username" required autocomplete="username" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="field-full">
            <mat-label>Password</mat-label>
            <mat-icon matPrefix class="field-icon">lock</mat-icon>
            <input matInput [type]="showPassword ? 'text' : 'password'"
                   [(ngModel)]="password" name="password" required
                   autocomplete="current-password" />
            <button mat-icon-button matSuffix type="button"
                    (click)="showPassword = !showPassword"
                    class="visibility-btn">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-flat-button type="submit" class="sign-in-btn"
                  [disabled]="!username || !password || isLoading">
            @if (isLoading) {
              <span class="btn-loading">
                <mat-spinner diameter="18" strokeWidth="2" class="btn-spinner"></mat-spinner>
                Signing in...
              </span>
            } @else {
              <mat-icon>login</mat-icon>
              Sign In
            }
          </button>

        </form>

        <div class="card-footer">
          <mat-icon class="footer-icon">support_agent</mat-icon>
          <span>Need access? Contact your administrator</span>
        </div>

      </mat-card-content>
    </mat-card>

  </div>
</div>
